<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Cantina La 35</title>
</head>

<body>

    <main class="menu">

        <!-- Botón superior derecho -->
        <button class="add-btn" type="button">
            +
        </button>

        <!-- Sección del código -->
        <section class="codigo">

            <h1>Código:</h1>

            <div class="codigo-input">
                <input
                    type="text"
                    id="codigo"
                    maxlength="3"
                    placeholder="___"
                >

                <button type="button" id="buscar-btn">
                    →
                </button>
            </div>

            <!-- 4 botones de comida -->
            <div class="menu-cuadricula-botones">
                <!-- Desayuno -->
                <button type="button" class="opcion-btn">
                    <svg class="icon-comida" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                    <span>Desayuno</span>
                </button>

                <!-- Almuerzo -->
                <button type="button" class="opcion-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-comida">
                        <path d="M19.496 12a2.5 2.5 0 00.399-2.214A2 2 0 0020.32 6.5 2 2 0 0019 3a2 2 0 00-1.5.68 2 2 0 00-3.287.424 2.5 2.5 0 00-3.189 2.06A3 3 0 0012 12l4-4"/>
                        <path d="M4 12a1 1 0 00-.99 1.133A9 9 0 0012 21a9 9 0 008.99-7.867A1 1 0 0020 12z"/>
                        <path d="M7 21h10"/>
                        <path d="M9.85 6.907A3.5 3.5 0 005.05 12"/>
                    </svg>
                    <span>Almuerzo</span>
                </button>

                <!-- Merienda -->
                <button type="button" class="opcion-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-comida">
                        <path d="M11 17h.01"/>
                        <path d="M11.496 2c.324-.016.558.292.529.615a4 4 0 004.235 4.368.713.713 0 01.758.757 4 4 0 004.366 4.237c.323-.03.63.204.614.527a10 10 0 01-2.915 6.566A1 1 0 114.93 4.918 10 10 0 0111.496 2"/>
                        <path d="M12 12h.01"/>
                        <path d="M16 16h.01"/>
                        <path d="M16 3h.01"/>
                        <path d="M21 4h.01"/>
                        <path d="M21 8h.01"/>
                        <path d="M7 14h.01"/>
                        <path d="M9 8h.01"/>
                    </svg>
                    <span>Merienda</span>
                </button>

                <!-- Cena -->
                <button type="button" class="opcion-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-comida">
                        <path d="M12 16H4a2 2 0 1 1 0-4h16a2 2 0 1 1 0 4h-4.25"/>
                        <path d="M5 12a2 2 0 0 1-2-2 9 7 0 0 1 18 0 2 2 0 0 1-2 2"/>
                        <path d="M5 16a2 2 0 0 0-2 2 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 2 2 0 0 0-2-2q0 0 0 0"/>
                        <path d="m6.67 12 6.13 4.6a2 2 0 0 0 2.8-.4l3.15-4.2"/>
                    </svg>
                    <span>Cena</span>
                </button>
            </div>

        </section>

        <!-- Separador central -->
        <div class="separador"></div>

        <!-- Sección de información -->
        <section class="informacion">

            <h1>Información:</h1>

            <div class="alumno">

                <div class="foto">
                    <img
                        src="foto.jpg"
                        alt="Foto del alumno"
                        id="foto-alumno"
                    >
                </div>

                <div class="datos">

                    <p>
                        <span>Nombre:</span>
                        <span id="nombre"></span>
                    </p>

                    <p>
                        <span>Apellido:</span>
                        <span id="apellido"></span>
                    </p>

                    <p>
                        <span>DNI:</span>
                        <span id="dni"></span>
                    </p>

                    <p>
                        <span>Curso:</span>
                        <span id="curso"></span>
                    </p>

                </div>

            </div>

        </section>

    </main>

    <!-- Barra inferior -->
    <footer class="barra-inferior">

        <div class="botones-inferiores">

            <button
                type="button"
                class="cancelar-btn"
                id="cancelar-btn"
            >
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            </button>

            <button
                type="button"
                class="registro-btn"
                id="manualBtn"
            >
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            </button>

        </div>

        <img
            src="Cantina-Logos/Logo2_sinfondo.png"
            alt="Cantina La 35"
            class="logo"
        >

    </footer>
    <script src="script.js"></script>
</body>
</html>
